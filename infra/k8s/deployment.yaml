apiVersion: apps/v1
kind: Deployment
metadata:
  name: hbh-app-deployment
  namespace: hampers-by-her
  labels:
    app.kubernetes.io/name: hampers-by-her
    app.kubernetes.io/component: web-api
    app.kubernetes.io/part-of: atelier-commerce
spec:
  replicas: 3
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: hampers-by-her
      app.kubernetes.io/component: web-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hampers-by-her
        app.kubernetes.io/component: web-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: commerce-server
          image: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/hampers-by-her:2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: hbh-app-config
            - secretRef:
                name: hbh-app-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 2
          volumeMounts:
            - name: persistent-data
              mountPath: /usr/src/app/data
            - name: runtime-logs
              mountPath: /usr/src/app/logs
      volumes:
        - name: persistent-data
          emptyDir: {}
        - name: runtime-logs
          emptyDir: {}

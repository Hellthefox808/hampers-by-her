apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hbh-app-hpa
  namespace: hampers-by-her
  labels:
    app.kubernetes.io/name: hampers-by-her
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hbh-app-deployment
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60

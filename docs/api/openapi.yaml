openapi: 3.1.0
info:
  title: Hampers by Her Digital Commerce API
  description: Official REST API for Hampers by Her luxury gifting storefront, bespoke atelier, and operations.
  version: 2.0.0
  contact:
    name: Hampers by Her Engineering
    url: https://hampersbyher.com/contact
servers:
  - url: https://api.hampersbyher.com/v1
    description: Production API Server
  - url: https://staging-api.hampersbyher.com/v1
    description: Staging Environment
paths:
  /catalog/products:
    get:
      summary: Retrieve list of curated hampers
      parameters:
        - name: occasion
          in: query
          schema:
            type: string
        - name: recipient
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Successful catalog listing response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
  /builder/validate-step:
    post:
      summary: Validate 11-step hamper builder configuration & volume
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuilderValidationRequest'
      responses:
        '200':
          description: Validation result and live fullness gauge
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuilderValidationResponse'
  /checkout/create-order:
    post:
      summary: Convert cart into order and initiate payment gateway
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created in PENDING_PAYMENT state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOrderResponse'
  /webhooks/razorpay:
    post:
      summary: Ingest Razorpay signed payment webhook
      parameters:
        - name: x-razorpay-signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook received and queued for processing

  # ── Smart Payments (Section 19 & SmartRouter) ──
  /payments/initiate:
    post:
      summary: Dynamic UPI Intent / Desktop QR & multi-acquirer checkout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId, amountPaise]
      responses:
        '200':
          description: Gateway session details with UPI intent or QR payload

  /payments/gateways/health:
    get:
      summary: Retrieve real-time acquirer health & circuit breaker metrics
      responses:
        '200':
          description: Health telemetry across Razorpay, Cashfree, and Stripe

  # ── Atelier Procedural Visualizer ──
  /atelier/visualize-hamper:
    post:
      summary: Generate photorealistic luxury vector SVG illustration of bespoke hamper
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                boxId: { type: string }
                ribbonColor: { type: string }
                waxSealColor: { type: string }
                sealMotif: { type: string }
                monogramInitials: { type: string }
                cardMessage: { type: string }
                recipientName: { type: string }
      responses:
        '200':
          description: Rendered SVG string, Base64 Data URI, and dimensions

  # ── Advanced Computational DSA Engines (39_DSA.md) ──
  /dsa/bin-pack-3d:
    post:
      summary: 3D volumetric bin-packing heuristic with upright and thermal constraints
      responses:
        '200':
          description: Fit verification, packing ratio, and recommended box

  /dsa/calculate-pricing:
    post:
      summary: 64-bit BigInt integer paise financial ledger calculation
      responses:
        '200':
          description: Net payable, capped coupons, and remainder-preserving GST

  /dsa/knapsack-optimize:
    post:
      summary: Multi-criteria budget knapsack optimization with 2-opt search
      responses:
        '200':
          description: Selected items, total cost, and aesthetic harmony score

  /dsa/tokenize-intent:
    post:
      summary: ReDoS-safe linear-time tokenizer and trigram fuzzy matcher
      responses:
        '200':
          description: Extracted occasions, price caps, and luxury intent flags

  # ── Authentication & RBAC (25_AUTH_SECURITY.md) ──
  /auth/request-otp:
    post:
      summary: Request passwordless 6-digit WhatsApp or SMS OTP
      responses:
        '200':
          description: OTP dispatched session status

  /auth/verify-otp:
    post:
      summary: Verify OTP code and issue URL-safe HMAC-SHA256 JWT
      responses:
        '200':
          description: JWT token and patron profile

  /auth/me:
    get:
      summary: Verify session JWT and retrieve patron claims
      responses:
        '200':
          description: Authenticated user details

  # ── Atelier Studio Operations OS (23_ADMIN_DASHBOARD.md) ──
  /admin/orders:
    get:
      summary: List studio fulfillment orders with QC status filtering
      responses:
        '200':
          description: Order list and count

  /admin/orders/{orderNumber}/qc-inspect:
    post:
      summary: Mandatory QC Photo Gate approval before dispatch
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Quality check confirmed and status updated

  /admin/orders/{orderNumber}/packing-slip:
    get:
      summary: Generate printable artisanal packing slip with wax seal details
      parameters:
        - name: orderNumber
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Printable HTML packing slip

  /admin/metrics:
    get:
      summary: Retrieve real-time studio KPIs, daily GMV, and bottleneck count
      responses:
        '200':
          description: Studio throughput metrics

  # ── Logistics Courier & AWB Tracking (20_DELIVERY_LOGISTICS.md) ──
  /delivery/manifest:
    post:
      summary: Generate courier shipping manifest and assign compliant AWB
      responses:
        '200':
          description: Assigned AWB, carrier routing, and pickup schedule

  /delivery/track/{identifier}:
    get:
      summary: Query tracking status and carrier checkpoints by Order or AWB
      parameters:
        - name: identifier
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Current checkpoint status and timeline

  /delivery/carrier-webhook:
    post:
      summary: Ingest carrier scan webhooks and trigger NDR recovery if failed
      responses:
        '200':
          description: Webhook processed and checkpoint logged

  # ── Notifications (30_NOTIFICATION_SYSTEM.md) ──
  /notifications/send:
    post:
      summary: Multi-channel notification dispatcher (WhatsApp HSM, Email, SMS)
      responses:
        '200':
          description: Dispatched notification logs

  # ── Storybook Stationery Inquiries & Archived Editions ──
  /catalog/archives:
    get:
      summary: List past limited-edition delivered hampers for ticket archive wall
      responses:
        '200':
          description: Archived editions list

  /inquiries:
    post:
      summary: Submit patron stationery contact or hamper enquiry with DSA lead scoring
      responses:
        '201':
          description: Inquiry stored with priority tier and WhatsApp handoff link
    get:
      summary: Retrieve submitted stationery inquiries (staff RBAC protected)
      responses:
        '200':
          description: Stored inquiries list
components:
  schemas:
    ProductListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ProductCard'
            pageInfo:
              type: object
              properties:
                hasNextPage:
                  type: boolean
                nextCursor:
                  type: string
    ProductCard:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        subtitle:
          type: string
        basePrice:
          type: number
        currency:
          type: string
        primaryImageUrl:
          type: string
        isCustomizable:
          type: boolean
        stockStatus:
          type: string
          enum: [IN_STOCK, LOW_STOCK, OUT_OF_STOCK]
    BuilderValidationRequest:
      type: object
      required: [boxSku, selectedComponentSkus]
      properties:
        boxSku:
          type: string
        selectedComponentSkus:
          type: array
          items:
            type: object
            properties:
              sku:
                type: string
              quantity:
                type: integer
    BuilderValidationResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            isValid:
              type: boolean
            boxFullnessPercentage:
              type: number
            remainingVolumeCm3:
              type: number
            totalWeightGrams:
              type: number
            requiresFragileCushion:
              type: boolean
    CreateOrderRequest:
      type: object
      required: [cartId, buyer, recipientAddress, deliverySchedule]
      properties:
        cartId:
          type: string
          format: uuid
        buyer:
          type: object
          properties:
            fullName:
              type: string
            email:
              type: string
            phoneNumber:
              type: string
        recipientAddress:
          type: object
          properties:
            recipientName:
              type: string
            addressLine1:
              type: string
            pincode:
              type: string
            city:
              type: string
            state:
              type: string
            phoneNumber:
              type: string
        deliverySchedule:
          type: object
          properties:
            preferredDate:
              type: string
              format: date
            deliverySlot:
              type: string
    CreateOrderResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            orderId:
              type: string
            orderStatus:
              type: string
            amountPayable:
              type: number
            currency:
              type: string
            razorpayOrderId:
              type: string

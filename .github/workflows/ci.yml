name: Hampers by Her CI/CD & DevSecOps Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  security-events: write

jobs:
  verify:
    name: Architecture Audit, Regression Tests & APK Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Audit All 44 Architectural Specifications (Section 40)
        run: npm run audit:docs

      - name: Execute Full Commerce, Platform & Infrastructure Test Suite
        run: npm test

      - name: Verify Android Voice AI APK Packaging
        run: npm run build:apk

      - name: Execute Complete Master Verification Pipeline
        run: npm run verify

  security_scan:
    name: Container Security & Vulnerability Scanning (Trivy)
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Docker Image for Scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: hampers-by-her:ci-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner (CRITICAL, HIGH)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "hampers-by-her:ci-scan"
          format: "table"
          exit-code: "0" # Audit mode in CI, blocks on deployment
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  iac_lint:
    name: Infrastructure as Code (IaC) Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Validate Terraform Formatting
        run: terraform fmt -check -recursive infra/terraform/
